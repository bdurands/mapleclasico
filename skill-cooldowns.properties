# ============================================================
# Custom Skill Cooldowns (Override)
# ============================================================
# Format:  skillId = cooldownInSeconds
#
# Any skill listed here will have its cooldown OVERRIDDEN,
# regardless of what the WZ file says (even if the WZ says 0).
#
# You can find skill IDs in the GM Handbook or with !id command.
# Cooldown is in SECONDS.
#
# Examples:
# 1121006 = 10       # Hero - Rush (10 seconds)
# 2121001 = 8        # Arch Mage F/P - Big Bang (8 seconds)
# 5121007 = 15       # Buccaneer - Barrage (15 seconds)
# 4221001 = 12       # Shadower - Assassinate (12 seconds)
# ============================================================
